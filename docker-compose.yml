services:
  api:
    build: .
    image: fraudguard-api:local
    ports:
      - "8000:8000"
    volumes:
      - predictions:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  predictions:
